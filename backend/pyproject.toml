[tool.ruff]  
line-length = 100
target-version = "py310"
exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom requires calling File()/Form()/Depends()
# in argument defaults; that's the intended pattern, not the mutable-default
# footgun B008 normally guards against.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["."]
